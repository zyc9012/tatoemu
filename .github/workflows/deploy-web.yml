name: Build and Deploy Web App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platforms/wasm/web/package-lock.json

      - name: Install web dependencies
        working-directory: platforms/wasm/web
        run: npm ci

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: '6.0.2'
          actions-cache-folder: '.emsdk-cache'

      - name: Prepare bundled SDL3
        run: embuilder build sdl3

      - name: Configure CMake
        run: >-
          emcmake cmake -S . -B build-wasm
          -DPLATFORM=wasm
          -DCMAKE_BUILD_TYPE=Release

      - name: Build WASM and web frontend
        run: cmake --build build-wasm --parallel "$(nproc)"

      - name: Verify build artifacts
        run: |
          test -f build-wasm/dist/index.html
          test -f build-wasm/dist/emulator/tatoemu.js
          test -f build-wasm/dist/emulator/tatoemu.wasm
          ls -lah build-wasm/dist/ build-wasm/dist/emulator/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: build-wasm/dist/
          retention-days: 30

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --assets build-wasm/dist --name=tatoemu --latest
