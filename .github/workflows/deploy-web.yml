name: Build and Deploy Web App

on:
  push:
    branches: main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Setup Emscripten
        uses: pyodide/setup-emsdk@v15
        with:
          version: '4.0.22'
          actions-cache-folder: '.emsdk-cache'
      
      - name: Cache SDL3
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/sdl3-install
          key: sdl3-3.4.0-${{ runner.os }}-emsdk-4.0.22
          restore-keys: |
            sdl3-3.4.0-${{ runner.os }}-
        id: sdl3-cache
      
      - name: Download and build SDL3
        if: steps.sdl3-cache.outputs.cache-hit != 'true'
        run: |
          SDL3_VERSION="3.4.0"
          SDL3_DIR="${{ github.workspace }}/.cache/sdl3-install"
          mkdir -p $SDL3_DIR
          
          # Download SDL3 source
          curl -L "https://github.com/libsdl-org/SDL/archive/refs/tags/release-${SDL3_VERSION}.tar.gz" -o sdl3.tar.gz
          tar -xzf sdl3.tar.gz
          cd SDL-release-${SDL3_VERSION}
          
          # Configure SDL3 for Emscripten
          emcmake cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$SDL3_DIR \
            -DSDL_DISABLE_INSTALL_DOCS=ON \
            -DSDL_TESTS=OFF
          
          # Build and install SDL3
          emmake cmake --build build -j$(nproc)
          emmake cmake --install build
      
      - name: Configure CMake
        run: |
          mkdir -p build-wasm
          cd build-wasm
          SDL3_DIR="${{ github.workspace }}/.cache/sdl3-install"
          emcmake cmake -DPLATFORM=wasm -DCMAKE_PREFIX_PATH=$SDL3_DIR -DSDL3_DIR=$SDL3_DIR/lib/cmake/SDL3 ..
      
      - name: Build WASM
        run: |
          cd build-wasm
          emmake make -j$(nproc)
      
      - name: Verify build artifacts
        run: ls -lah build-wasm/dist/
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: build-wasm/dist/
          retention-days: 30
      
      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --dir=build-wasm/dist --site tatoemu --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
