<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TatoEmu - WebAssembly</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .toolbar {
            background: #1e1e1e;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 2px solid #333;
            flex-shrink: 0;
        }

        .toolbar-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #e0e0e0;
            margin-right: auto;
        }

        .toolbar-btn {
            background: #4a90e2;
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .toolbar-btn:hover {
            background: #357abd;
        }

        .canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            background: #000;
        }

        /* SDL canvas styling */
        #canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            outline: none;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(45, 45, 45, 0.95);
            padding: 20px 30px;
            border-radius: 8px;
            z-index: 10;
        }

        #status {
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .loading {
            color: #ffd700;
        }

        .ready {
            color: #90ee90;
        }

        .error {
            color: #ff6b6b;
        }

        /* Help Modal */
        .help-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .help-modal.show {
            display: flex;
        }

        .help-modal-content {
            background: rgba(45, 45, 45, 0.98);
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .help-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .help-modal-header h2 {
            color: #e0e0e0;
            font-size: 1.5em;
        }

        .help-modal-close {
            background: transparent;
            border: none;
            color: #e0e0e0;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .help-modal-close:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
        }

        .control-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            background: #2d2d2d;
            border-radius: 6px;
        }

        .control-key {
            font-weight: 600;
            color: #90caf9;
        }

        .control-action {
            color: #b0b0b0;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <div class="toolbar-title" id="gameTitle">TatoEmu</div>
        <input type="file" id="romInput" accept=".gb,.gbc,.nes" style="display: none;">
        <button class="toolbar-btn" id="loadRomBtn">
            Load ROM
        </button>
        <input type="file" id="bootromInput" accept=".bin" style="display: none;">
        <button class="toolbar-btn" id="loadBootromBtn">
            Load Bootrom
        </button>
        <button class="toolbar-btn" id="helpBtn">
            Help
        </button>
    </div>

    <div class="canvas-container">
        <div class="status" id="status">
            <span class="spinner"></span>
            <span>Loading emulator...</span>
        </div>
        <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>

    <!-- Help Modal -->
    <div id="helpModal" class="help-modal">
        <div class="help-modal-content">
            <div class="help-modal-header">
                <h2>🎯 Controls</h2>
                <button class="help-modal-close" id="helpModalClose">&times;</button>
            </div>
            <div class="controls-grid">
                <div class="control-item">
                    <span class="control-key">Arrow Keys</span>
                    <span class="control-action">D-Pad</span>
                </div>
                <div class="control-item">
                    <span class="control-key">Z</span>
                    <span class="control-action">A Button</span>
                </div>
                <div class="control-item">
                    <span class="control-key">X</span>
                    <span class="control-action">B Button</span>
                </div>
                <div class="control-item">
                    <span class="control-key">Enter</span>
                    <span class="control-action">Start</span>
                </div>
                <div class="control-item">
                    <span class="control-key">Shift</span>
                    <span class="control-action">Select</span>
                </div>
                <div class="control-item">
                    <span class="control-key">P</span>
                    <span class="control-action">Pause/Resume</span>
                </div>
                <div class="control-item">
                    <span class="control-key">F5</span>
                    <span class="control-action">Save State</span>
                </div>
                <div class="control-item">
                    <span class="control-key">F9</span>
                    <span class="control-action">Load State</span>
                </div>
            </div>
        </div>
    </div>

    <script type='text/javascript'>
        let romLoaded = false;
        let bootromLoaded = false;

        const titleElement = document.getElementById('gameTitle');

        // Help Modal functionality
        const helpModal = document.getElementById('helpModal');
        const helpBtn = document.getElementById('helpBtn');
        const helpModalClose = document.getElementById('helpModalClose');

        helpBtn.addEventListener('click', function() {
            helpModal.classList.add('show');
        });

        helpModalClose.addEventListener('click', function() {
            helpModal.classList.remove('show');
        });

        helpModal.addEventListener('click', function(e) {
            if (e.target === helpModal) {
                helpModal.classList.remove('show');
            }
        });

        // File upload button handlers
        const loadRomBtn = document.getElementById('loadRomBtn');
        const loadBootromBtn = document.getElementById('loadBootromBtn');
        const romInput = document.getElementById('romInput');
        const bootromInput = document.getElementById('bootromInput');

        loadRomBtn.addEventListener('click', function() {
            romInput.click();
        });

        loadBootromBtn.addEventListener('click', function() {
            bootromInput.click();
        });

        // Emscripten configuration
        var Module = {
            preRun: [function() {
                try {
                    Module.FS.mkdir('/roms');
                } catch (e) {
                    // Directory already exists or mount point ready
                }
                try {
                    Module.FS.mount(Module.FS.filesystems.IDBFS, { autoPersist: true }, '/roms');
                } catch (err) {
                    console.error('Failed to mount persistent storage:', err);
                }
            }],
            postRun: [function() {
                setupFileUploads();
            }],
            print: function(text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.log(text);
            },
            printErr: function(text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.error(text);
            },
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                // Prevent right-click context menu on canvas
                canvas.addEventListener("webglcontextlost", function(e) { 
                    alert('WebGL context lost. You will need to reload the page.'); 
                    e.preventDefault(); 
                }, false);
                return canvas;
            })(),
            setStatus: function(text) {
                var statusElement = document.getElementById('status');
                if (!statusElement) return;
                
                if (text) {
                    var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                    if (m) {
                        // Progress
                        var percent = Math.round((parseFloat(m[2]) / parseFloat(m[4])) * 100);
                        text = m[1] + ' (' + percent + '%)';
                        statusElement.innerHTML = '<span class="loading"><span class="spinner"></span> ' + text + '</span>';
                    } else {
                        statusElement.innerHTML = '<span class="loading"><span class="spinner"></span> ' + text + '</span>';
                    }
                } else {
                    statusElement.style.display = 'none';
                }
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : '');
            }
        };

        // File upload handling
        function setupFileUploads() {
            romInput.addEventListener('change', async function(e) {
                const file = e.target.files[0];
                if (!file) return;

                try {
                    // Read file
                    const arrayBuffer = await file.arrayBuffer();
                    const uint8Array = new Uint8Array(arrayBuffer);
                    
                    // Write file to virtual filesystem
                    const filename = '/roms/' + file.name;
                    Module.FS.writeFile(filename, uint8Array);
                    
                    // Call C function to load ROM
                    const result = Module.ccall('loadROMFile', 'number', ['string'], [filename]);
                    
                    if (result === 1) {
                        Module.setStatus('');
                        romLoaded = true;
                        titleElement.textContent = file.name;
                    } else {
                        alert('Failed to load ROM file');
                    }
                } catch (error) {
                    console.error('Error loading ROM:', error);
                    alert('Error loading ROM: ' + error.message);
                }
            });

            bootromInput.addEventListener('change', async function(e) {
                const file = e.target.files[0];
                if (!file) return;

                try {
                    // Read file
                    const arrayBuffer = await file.arrayBuffer();
                    const uint8Array = new Uint8Array(arrayBuffer);
                    
                    // Write file to virtual filesystem
                    const filename = '/roms/' + file.name;
                    Module.FS.writeFile(filename, uint8Array);
                    
                    // Call C function to load bootrom
                    const result = Module.ccall('loadBootromFile', 'number', ['string'], [filename]);
                    
                    if (result === 1) {
                        bootromLoaded = true;
                    } else {
                        alert('Failed to load bootrom file');
                    }
                } catch (error) {
                    console.error('Error loading bootrom:', error);
                    alert('Error loading bootrom: ' + error.message);
                }
            });
        }
        
        Module.setStatus('Downloading...');
        
        window.onerror = function(event) {
            Module.setStatus('Exception thrown, see JavaScript console');
            Module.setStatus = function(text) {
                if (text) {
                    var statusElement = document.getElementById('status');
                    if (statusElement) {
                        statusElement.style.display = 'block';
                        statusElement.innerHTML = '<span class="error">⚠ ' + text + '</span>';
                    }
                }
            };
        };
    </script>
    
    {{{ SCRIPT }}}
</body>
</html>
